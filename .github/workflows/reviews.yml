name: Actualizar reseñas de Google

on:
  schedule:
    # Lunes a las 06:00 UTC (08:00 Europa/Madrid en verano, 07:00 en invierno)
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch reviews from Google Places
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node tools/fetch-reviews.js

      - name: Commit changes (si hay)
        run: |
          if [ -n "$(git status --porcelain data/reviews.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/reviews.json
            git commit -m "chore(reviews): actualizar reseñas desde Google Places"
            git push
          else
            echo "Sin cambios en data/reviews.json"
          fi
