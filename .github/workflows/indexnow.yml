# Avisa a IndexNow (Bing, Yandex, Seznam…) de las páginas que cambian en cada publicación.
# Google no usa IndexNow; para Google sigue contando el sitemap.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:   # lanzarlo a mano: envía todas las URL del sitemap

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enviar URLs cambiadas
        env:
          INDEXNOW_KEY: 0a0c5999a70121f4eef1d1517d3bc5e8
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git ls-files '*.html' > cambiados.txt
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Primer push: no hay diferencias que enviar."; exit 0
          else
            git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- '*.html' > cambiados.txt || true
          fi
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.request
          host = "zervitecnics.es"; key = os.environ["INDEXNOW_KEY"]
          urls = []
          for f in open("cambiados.txt").read().split():
              if not os.path.exists(f) or f.startswith(("tools/", "interno/")):
                  continue
              if re.search(r'<meta[^>]+robots[^>]+noindex', open(f, encoding="utf-8").read(), re.I):
                  continue
              path = f[:-len("index.html")] if f.endswith("index.html") else f
              urls.append(f"https://{host}/{path}")
          if not urls:
              print("Sin páginas indexables cambiadas."); raise SystemExit(0)
          # GitHub Pages tarda en publicar: esperamos a que la clave esté visible (máx. ~10 min).
          key_url = f"https://{host}/{key}.txt"
          for _ in range(40):
              try:
                  if urllib.request.urlopen(key_url, timeout=15).read().decode().strip() == key:
                      break
              except Exception:
                  pass
              time.sleep(15)
          else:
              print("La clave no está publicada todavía; no se envía nada."); raise SystemExit(1)
          time.sleep(30)
          body = {"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls[:10000]}
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=json.dumps(body).encode(),
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          for intento in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("IndexNow:", r.status, "-", len(urls), "URL enviadas"); break
              except urllib.error.HTTPError as e:
                  print("IndexNow respondió", e.code, "- reintento en 60 s")
                  if intento == 2: raise
                  time.sleep(60)
          PY
